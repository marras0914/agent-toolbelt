name: First-call watch

# Opens a GitHub issue the first time a newly shipped tool is actually called.
#
# Why a workflow and not a scheduled cloud agent: the check needs ADMIN_SECRET,
# which already exists here as a repo secret. A cloud routine has no secret
# store, so the value would have to sit in its prompt — and ADMIN_SECRET grants
# GET /admin/backup, i.e. a full database download. Actions keeps it in the
# secret store and never prints it.
#
# Idempotent by construction: it looks for an existing issue with the same title
# before creating one, so a tool that keeps getting called does not generate a
# daily issue. Once the issue exists this job goes quiet permanently.
#
# To watch a different tool later, change WATCH_TOOL.

on:
  schedule:
    - cron: '17 13 * * *'   # daily 13:17 UTC — off the hour, since :00 is when everyone else's cron fires
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WATCH_TOOL: portfolio-review
      BASE_URL: https://www.agenttoolbelt.live
    steps:
      - name: Look for the first call
        id: probe
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -euo pipefail

          # --fail so an auth failure is a failed job rather than a silent
          # "0 calls", which would leave this watch asleep forever.
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${ADMIN_SECRET}" \
            "${BASE_URL}/admin/usage" -o usage.json

          calls=$(WATCH_TOOL="$WATCH_TOOL" python3 -c '
          import json, os
          tool = os.environ["WATCH_TOOL"]
          rows = json.load(open("usage.json")).get("byTool", [])
          print(next((r["calls"] for r in rows if r["tool_name"] == tool), 0))
          ')

          echo "${WATCH_TOOL}: ${calls} call(s) in the last 30 days"
          echo "calls=${calls}" >> "$GITHUB_OUTPUT"

      - name: Open an issue on first call
        if: steps.probe.outputs.calls != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: ${{ steps.probe.outputs.calls }}
        run: |
          set -euo pipefail
          title="${WATCH_TOOL} got its first API call"

          # Idempotence: never open a second issue for the same milestone.
          if gh issue list --state all --search "$title in:title" \
               --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "issue already exists — nothing to do"
            exit 0
          fi

          {
            printf '%s has been called **%s time(s)** in the last 30 days.\n' \
              "$WATCH_TOOL" "$CALLS"
            printf 'This is its first recorded usage since publishing.\n\n'
            printf 'Worth checking who called it and whether they came back:\n\n'
            printf '    GET /admin/usage                 per-tool totals\n'
            printf '    GET /admin/clients               find the caller\n'
            printf '    GET /admin/clients/:id/usage     their breakdown\n\n'
            printf 'The signal that matters is distinct_inputs vs calls: one input\n'
            printf 'retried is very different from real portfolios being reviewed.\n\n'
            printf 'This watch is now silent and will not open another issue.\n'
          } > body.md

          gh issue create --title "$title" --body-file body.md
          echo "issue opened"
